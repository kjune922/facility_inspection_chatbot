spring.application.name=WaterAPI-local
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/water-local
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.data.web.pageable.max-page-size=100
server.error.include-message=never

# One local AI model (install with ollama pull first)
water.ai.base-url=http://127.0.0.1:11434
water.ai.model=${OLLAMA_MODEL:qwen2.5:3b}
