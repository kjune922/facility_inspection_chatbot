<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('조회 결과')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('facilities')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('조회 결과')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>저장한 조회 결과</h1><p class="page-description">질문과 조회 당시의 근거 기록을 확인하세요.</p></div><div class="heading-actions"><a class="btn btn-secondary" th:href="@{/facilities/{id}/questions(id=${history.facility.id})}">질문 목록</a></div></div><section class="panel"><div class="panel-heading"><div><p class="eyebrow" th:text="${history.facilityName}"></p><h2 class="question-title" th:text="${history.question}"></h2></div><span class="badge neutral">기록 조회 모드</span></div><dl class="metadata three-columns"><div><dt>검색어</dt><dd th:text="${history.keyword.isEmpty() ? '전체' : history.keyword}"></dd></div><div><dt>조회 기간</dt><dd><span th:text="${history.fromDate == null ? '제한 없음' : history.fromDate}"></span> ~ <span th:text="${history.toDate == null ? '제한 없음' : history.toDate}"></span></dd></div><div><dt>제공 범위</dt><dd><strong th:text="${history.matchedCount} + '건 일치'"></strong> · 최근 <span th:text="${#lists.size(history.evidence)}"></span>건</dd></div></dl><div class="result-body"><pre class="answer" th:text="${history.answer}"></pre></div></section><div class="section-heading"><div><h2>근거 기록</h2><p>조회 당시의 복사본입니다. 원본을 변경하거나 삭제해도 아래 내용은 유지됩니다.</p></div><span class="count-label" th:text="${#lists.size(history.evidence)} + '건'"></span></div><div class="panel" th:if="${#lists.isEmpty(history.evidence)}"><div class="empty-state"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><strong>조건에 맞는 근거가 없습니다.</strong><p>기간이나 검색어를 바꿔 다시 조회해 보세요.</p></div></div><div class="evidence-grid"><article class="panel evidence-card" th:each="item : ${history.evidence}"><div class="panel-heading"><div><p class="eyebrow" th:text="'점검 #' + ${item.inspectionId}"></p><h3 th:text="${item.inspectionDate}"></h3></div><span class="badge" th:attr="data-status=${item.processingStatus}" th:text="${item.processingStatus.description}"></span></div><div class="panel-body"><p class="record-content" th:text="${item.content}"></p></div><div class="evidence-footer"><span class="muted small">조회 당시 복사본</span><a class="row-link" th:if="${#lists.contains(availableIds, item.inspectionId)}" th:href="@{/inspections/{id}(id=${item.inspectionId})}">현재 원본 확인 ↗</a><span class="muted small" th:unless="${#lists.contains(availableIds, item.inspectionId)}">원본 삭제됨</span></div></article></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
