<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('샘플 분석')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('analyses')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('샘플 분석')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>샘플 분석 결과</h1><p class="page-description">점검일지에서 생성한 샘플 결과를 모아봅니다.</p></div><div class="heading-actions"></div></div><div class="notice"><span class="notice-icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/></svg></span><div><strong>화면 확인용 샘플 데이터입니다.</strong><p>AI가 연결되지 않은 고정 응답이며, 실제 시설 상태에 대한 판단이 아닙니다.</p></div></div><section class="panel"><div class="panel-heading"><div><h2>분석 이력</h2><p>점검 상세에서 전체 결과를 확인할 수 있습니다.</p></div></div><form class="filter-bar" th:action="@{/analyses}" method="get"><div class="filter-field"><label for="riskLevel">샘플 위험도</label><select id="riskLevel" name="riskLevel"><option value="">전체</option><option th:each="risk : ${riskLevels}" th:value="${risk}" th:text="${risk.description}" th:selected="${risk == selectedRiskLevel}"></option></select></div><button class="btn btn-primary" type="submit">조회</button><a class="text-link filter-reset" th:href="@{/analyses}">초기화</a></form><div class="table-scroll"><table><thead><tr><th class="col-id">번호</th><th>시설</th><th class="col-content">요약</th><th>샘플 위험도</th><th>생성 시각</th><th>상세</th></tr></thead><tbody><tr th:each="analysis : ${analyses.content}"><td class="muted" th:text="${analysis.id}"></td><td><a class="table-title" th:href="@{/inspections/{id}(id=${analysis.inspectionReport.id})}" th:text="${analysis.inspectionReport.facility.name}"></a></td><td><span class="truncate" th:text="${analysis.summary}"></span></td><td><span class="badge" th:attr="data-status=${analysis.riskLevel}" th:text="${analysis.riskLevel.description}"></span></td><td class="nowrap" th:text="${#temporals.format(analysis.analyzedAt, 'yyyy-MM-dd HH:mm')}"></td><td><a class="row-link" th:href="@{/inspections/{id}(id=${analysis.inspectionReport.id})}">상세 보기 ↗</a></td></tr><tr th:if="${analyses.empty}"><td colspan="6" class="empty-cell"><div class="empty-state"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 13 2 2 4-4M9 18h6"/></svg><strong>샘플 분석 이력이 없습니다.</strong><p>점검 상세에서 샘플 결과를 생성할 수 있습니다.</p></div></td></tr></tbody></table></div><div class="table-footer"><span class="muted" th:text="'총 ' + ${analyses.totalElements} + '건'"></span><nav class="pagination" aria-label="페이지 이동"><a class="btn btn-secondary btn-sm" th:if="${analyses.hasPrevious()}" th:href="@{/analyses(page=${analyses.number - 1},size=${analyses.size},riskLevel=${selectedRiskLevel})}">이전</a><span class="page-indicator" th:text="${(analyses.number + 1) + ' / ' + (analyses.totalPages == 0 ? 1 : analyses.totalPages)}"></span><a class="btn btn-secondary btn-sm" th:if="${analyses.hasNext()}" th:href="@{/analyses(page=${analyses.number + 1},size=${analyses.size},riskLevel=${selectedRiskLevel})}">다음</a></nav></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
