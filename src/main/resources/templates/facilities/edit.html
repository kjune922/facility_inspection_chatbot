<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('시설 수정')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('facilities')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('시설 수정')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>시설 수정</h1><p class="page-description">필수 항목을 입력하고 변경 내용을 저장하세요.</p></div><div class="heading-actions"></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><h2>기본 정보</h2><span class="muted small">* 필수 입력</span></div><form class="editor-form" th:action="@{/facilities/{id}/edit(id=${facilityId})}" th:object="${facilityForm}" method="post"><div class="form-grid"><div class="form-field"><label for="name">시설 이름 <span class="required">*</span></label><input id="name" type="text" th:field="*{name}" maxlength="50" placeholder="예: 1번 펌프" required th:errorclass="input-error"><p class="field-error" th:errors="*{name}"></p></div><div class="form-field"><label for="facilityType">시설 유형 <span class="required">*</span></label><select id="facilityType" th:field="*{facilityType}" required th:errorclass="input-error"><option value="">유형을 선택하세요</option><option th:each="type : ${facilityTypes}" th:value="${type}" th:text="${type}"></option></select><p class="field-error" th:errors="*{facilityType}"></p></div><div class="form-field span-two"><label for="location">시설 위치 <span class="required">*</span></label><input id="location" type="text" th:field="*{location}" maxlength="100" placeholder="예: 부산 정수장 A동 1층" required th:errorclass="input-error"><p class="field-error" th:errors="*{location}"></p></div></div><div class="form-actions"><a class="btn btn-secondary" th:href="@{/facilities}">취소</a><button class="btn btn-primary" type="submit">변경 내용 저장</button></div></form></section><aside class="help-card"><span class="help-icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5l8-3v19M12 9h8v12M2 21h20M7 7h2M7 11h2M7 15h2M15 12h2M15 16h2"/></svg></span><h3>시설 정보를 한곳에</h3><p>알아보기 쉬운 시설명과 구체적인 위치를 입력하면 점검 기록을 찾기 편합니다.</p><div class="help-divider"></div><p class="small">입력값에 문제가 있으면 해당 항목 아래에 안내가 표시됩니다.</p></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
