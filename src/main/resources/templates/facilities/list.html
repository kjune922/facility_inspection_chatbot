<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('시설 관리')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('facilities')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('시설 관리')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>시설 관리</h1><p class="page-description">점검할 시설을 등록하고, 시설별 기록을 확인하세요.</p></div><div class="heading-actions"><a class="btn btn-primary" th:href="@{/facilities/new}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>시설 등록</a></div></div><section class="panel"><div class="panel-heading"><div><h2>등록된 시설</h2><p>시설명을 누르면 해당 시설의 기록을 조회할 수 있습니다.</p></div><span class="count-label" th:text="${#lists.size(facilities)} + '개 시설'"></span></div><div class="table-scroll"><table><thead><tr><th class="col-id">번호</th><th>시설명</th><th>유형</th><th>위치</th><th class="col-action">관리</th></tr></thead><tbody><tr th:each="facility : ${facilities}"><td class="muted" th:text="${facility.id}"></td><td><a class="table-title" th:href="@{/chat(facilityId=${facility.id})}" th:text="${facility.name}"></a><small class="cell-caption">기록 조회 · 질문 이력</small></td><td><span class="badge neutral" th:text="${facility.facilityType}"></span></td><td class="wrap-location" th:text="${facility.location}"></td><td><div class="row-actions"><a class="btn btn-secondary btn-sm" th:href="@{/facilities/{id}/edit(id=${facility.id})}">수정</a><form class="inline-form" th:action="@{/facilities/{id}/delete(id=${facility.id})}" method="post" onsubmit="return confirm('시설을 삭제하시겠습니까?');"><button class="btn btn-danger-ghost btn-sm" type="submit">삭제</button></form></div></td></tr><tr th:if="${#lists.isEmpty(facilities)}"><td colspan="5" class="empty-cell"><div class="empty-state"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 13 2 2 4-4M9 18h6"/></svg><strong>아직 등록된 시설이 없습니다.</strong><p>시설 등록 버튼을 눌러 첫 시설을 추가하세요.</p></div></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
