<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('요청 안내')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('요청 안내')}"></header>
<main id="main" class="main-content"><section class="panel error-panel"><div class="error-symbol">!</div><p class="eyebrow" th:text="'ERROR / ' + ${status}"></p><h1>요청을 처리할 수 없습니다.</h1><p class="error-message" th:text="${message}">잠시 후 다시 시도해 주세요.</p><div class="error-actions"><a class="btn btn-primary" th:href="@{/}">대시보드</a><a class="btn btn-secondary" th:href="@{/inspections}">점검일지 목록</a></div><details class="error-details"><summary>요청 정보 확인</summary><dl><dt>경로</dt><dd th:text="${path}"></dd><dt>발생 시각</dt><dd th:text="${timestamp}"></dd><dt>상태</dt><dd th:text="${error}"></dd></dl></details></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
