<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('점검일지 수정')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('inspections')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('점검일지 수정')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>점검일지 수정</h1><p class="page-description">필수 항목을 입력하고 변경 내용을 저장하세요.</p></div><div class="heading-actions"></div></div><div class="content-grid"><section class="panel"><div class="panel-heading"><h2>기본 정보</h2><span class="muted small">* 필수 입력</span></div><form class="editor-form" th:action="@{/inspections/{id}/edit(id=${inspectionId})}" th:object="${inspectionForm}" method="post"><div class="form-grid"><div class="form-field"><label for="inspectionDate">점검 일자 <span class="required">*</span></label><input id="inspectionDate" type="date" th:field="*{inspectionDate}" required th:errorclass="input-error"><p class="field-error" th:errors="*{inspectionDate}"></p></div><div class="form-field span-two"><label for="content">점검 내용 <span class="required">*</span></label><textarea id="content" th:field="*{content}" rows="8" maxlength="2000" required placeholder="확인한 증상, 점검 부위, 조치 내용을 구체적으로 기록하세요." th:errorclass="input-error"></textarea><p class="field-error" th:errors="*{content}"></p><p class="field-hint">최대 2,000자 · 실제 확인한 내용을 중심으로 작성해 주세요.</p></div></div><div class="form-actions"><a class="btn btn-secondary" th:href="@{/inspections/{id}(id=${inspectionId})}">취소</a><button class="btn btn-primary" type="submit">변경 내용 저장</button></div></form></section><aside class="help-card"><span class="help-icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 13 2 2 4-4M9 18h6"/></svg></span><h3>다음 점검을 위한 기록</h3><p>발생 위치, 관찰한 증상과 조치 내용을 함께 남기면 이후 점검에서 변화를 확인하기 쉽습니다.</p><div class="help-divider"></div><p class="small">입력값에 문제가 있으면 해당 항목 아래에 안내가 표시됩니다.</p></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
