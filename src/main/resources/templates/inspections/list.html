<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('점검일지')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('inspections')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('점검일지')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>점검일지</h1><p class="page-description">시설별 점검 내용과 처리 상태를 확인하고 관리하세요.</p></div><div class="heading-actions"><a class="btn btn-primary" th:href="@{/inspections/new}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>점검일지 등록</a></div></div><section class="panel"><div class="panel-heading"><div><h2>전체 점검 기록</h2><p>처리 상태를 선택해 필요한 기록을 찾아보세요.</p></div><span class="count-label" th:text="${inspections.totalElements} + '건'"></span></div>
<form class="filter-bar" th:action="@{/inspections}" method="get"><div class="filter-field"><label for="processingStatus">처리 상태</label><select id="processingStatus" name="processingStatus"><option value="">전체 상태</option><option th:each="status : ${processingStatuses}" th:value="${status}" th:text="${status.description}" th:selected="${status == selectedProcessingStatus}"></option></select></div><button class="btn btn-primary" type="submit"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>조회</button><a class="text-link filter-reset" th:href="@{/inspections}">초기화</a></form>
<div class="table-scroll"><table><thead><tr><th class="col-id">번호</th><th>시설</th><th>점검 일자</th><th>처리 상태</th><th class="col-content">점검 내용</th><th class="col-action">상세</th></tr></thead><tbody>
<tr th:each="inspection : ${inspections.content}"><td class="muted" th:text="${inspection.id}"></td><td><a class="table-title" th:href="@{/facilities/{id}/questions(id=${inspection.facility.id})}" th:text="${inspection.facility.name}"></a></td><td class="nowrap" th:text="${inspection.inspectionDate}"></td><td><span class="badge" th:attr="data-status=${inspection.processingStatus}" th:text="${inspection.processingStatus.description}"></span></td><td><span class="truncate" th:text="${inspection.content}"></span></td><td><a class="row-link" th:href="@{/inspections/{id}(id=${inspection.id})}">상세 보기 <span aria-hidden="true">↗</span></a></td></tr>
<tr th:if="${inspections.empty}"><td colspan="6" class="empty-cell"><div class="empty-state"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 13 2 2 4-4M9 18h6"/></svg><strong>조회된 점검일지가 없습니다.</strong><p>필터를 변경하거나 새로운 점검일지를 등록해 보세요.</p></div></td></tr></tbody></table></div><div class="table-footer"><span class="muted" th:text="'총 ' + ${inspections.totalElements} + '건'"></span><nav class="pagination" aria-label="페이지 이동"><a class="btn btn-secondary btn-sm" th:if="${inspections.hasPrevious()}" th:href="@{/inspections(page=${inspections.number - 1},size=${inspections.size},processingStatus=${selectedProcessingStatus})}">이전</a><span class="page-indicator" th:text="${(inspections.number + 1) + ' / ' + (inspections.totalPages == 0 ? 1 : inspections.totalPages)}"></span><a class="btn btn-secondary btn-sm" th:if="${inspections.hasNext()}" th:href="@{/inspections(page=${inspections.number + 1},size=${inspections.size},processingStatus=${selectedProcessingStatus})}">다음</a></nav></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
