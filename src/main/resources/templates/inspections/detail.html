<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('점검 상세')}"></head><body>
<a href="#main" class="skip-link">본문으로 이동</a>
<aside th:replace="~{fragments/layout :: sidebar('inspections')}"></aside>
<div class="app-shell"><header th:replace="~{fragments/layout :: topbar('점검 상세')}"></header>
<main id="main" class="main-content"><div class="page-heading"><div><p class="eyebrow">WATERAPI WORKSPACE</p><h1>점검일지 상세</h1><p class="page-description">점검 내용과 처리 상태를 확인하세요.</p></div><div class="heading-actions"><a class="btn btn-secondary" th:href="@{/inspections}">목록으로</a><a class="btn btn-primary" th:href="@{/inspections/{id}/edit(id=${inspection.id})}">점검일지 수정</a></div></div><div class="detail-grid"><div class="stack"><section class="panel"><div class="panel-heading"><div><p class="eyebrow" th:text="'INSPECTION / #' + ${inspection.id}"></p><h2 th:text="${inspection.facility.name}"></h2></div><span class="badge" th:attr="data-status=${inspection.processingStatus}" th:text="${inspection.processingStatus.description}"></span></div><dl class="metadata"><div><dt>점검 일자</dt><dd th:text="${inspection.inspectionDate}"></dd></div><div><dt>시설 유형</dt><dd th:text="${inspection.facility.facilityType}"></dd></div><div class="span-two"><dt>시설 위치</dt><dd th:text="${inspection.facility.location}"></dd></div></dl><div class="record-section"><h3>점검 내용</h3><p class="record-content" th:text="${inspection.content}"></p></div></section>
<section class="panel"><div class="panel-heading"><div><h2>점검 기록을 AI에게 물어보세요</h2><p>이 시설의 최근 기록을 바탕으로 상태와 조치 내용을 정리합니다.</p></div></div><div class="panel-body"><a class="btn btn-primary" th:href="@{/chat(facilityId=${inspection.facility.id})}">이 시설 AI 챗봇 열기 →</a></div></section></div>
<aside class="stack"><section class="panel"><div class="panel-heading"><h2>처리 상태 변경</h2></div><form class="panel-body" th:action="@{/inspections/{id}/status(id=${inspection.id})}" method="post"><label for="detail-status">현재 처리 단계</label><select id="detail-status" name="processingStatus"><option th:each="status : ${T(com.kjune922.waterapi.inspection.ProcessingStatus).values()}" th:value="${status}" th:text="${status.description}" th:selected="${status == inspection.processingStatus}"></option></select><button class="btn btn-primary full-width" type="submit">상태 저장</button></form></section><a class="help-card link-card" th:href="@{/chat(facilityId=${inspection.facility.id})}"><span class="help-icon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><h3>이 시설의 지난 기록</h3><p>다른 점검 기록을 조회하고 질문 이력을 남겨보세요.</p><span class="text-link">AI 챗봇으로 이동 →</span></a><section class="danger-zone"><h3>점검일지 삭제</h3><p>삭제한 원본과 샘플 결과는 복구할 수 없습니다. 질문에 저장된 근거 복사본은 유지됩니다.</p><form th:action="@{/inspections/{id}/delete(id=${inspection.id})}" method="post" onsubmit="return confirm('점검일지와 샘플 분석 결과를 삭제하시겠습니까?');"><button class="btn btn-danger-ghost btn-sm" type="submit">점검일지 삭제</button></form></section></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></body></html>
